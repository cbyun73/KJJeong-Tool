<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>인물 이미지 측정 도구</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #fff;
    }
    h1 {
      margin-bottom: 10px;
    }
    #imageCanvas {
      border: 1px solid #ccc;
      width: 90vw;      /* 뷰포트 기준 너비 */
      max-width: 400px; /* 최대 400px */
      height: auto;
      display: block;
      margin: 10px auto;
    }
    #buttonContainer {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 10px 0;
    }
    #coords {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-line;
      text-align: left;
      padding: 10px;
      background: #f9f9f9;
      border: 1px dashed #aaa;
      width: 90%;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 6px;
    }
    #fileInputWrapper {
      margin-bottom: 10px;
    }
    #fileInput {
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>인물 이미지 측정 도구</h1>

  <div id="fileInputWrapper">
    <div>측정할 이미지를 선택하세요. (여러 장 선택 가능)</div>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </div>

  <canvas id="imageCanvas"></canvas>

  <div id="buttonContainer">
    <button id="prevBtn">이전</button>
    <button id="nextBtn">다음</button>
    <button id="resetBtn">현재 이미지 좌표 초기화</button>
    <button id="clearAllBtn">전체 데이터 초기화</button>
    <button id="copyBtn">현재 좌표 복사</button>
    <button id="downloadBtn">CSV 다운로드</button>
  </div>

  <div id="coords">이미지를 선택한 뒤, 좌표를 클릭해 주세요.</div>

  <script>
    // 선택된 로컬 이미지 파일 목록
    let imageFiles = [];
    let currentImageIndex = 0;
    let points = [];
    const results = [];

    const pointLabels = [
      "1. 정수리", "2. 턱", "3. 가랑이", "4. 발끝", "5. 배꼽", "6. 손끝"
    ];

    const canvas = document.getElementById("imageCanvas");
    const ctx = canvas.getContext("2d");
    const coordsDisplay = document.getElementById("coords");
    const fileInput = document.getElementById("fileInput");

    function loadImage(index) {
      const file = imageFiles[index];
      if (!file) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        coordsDisplay.textContent = "이미지를 선택한 뒤 사용하세요.";
        return;
      }

      const img = new Image();
      const url = URL.createObjectURL(file);

      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        drawPoints();
        URL.revokeObjectURL(url); // 메모리 정리
        updateCoordsDisplay();
      };
      img.src = url;
    }

    function drawPoints() {
      ctx.font = "24px Arial";
      points.forEach((pt, i) => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 5, 0, 2 * Math.PI);
        ctx.fillStyle = "red";
        ctx.fill();
        ctx.fillStyle = "blue";
        const label = pointLabels[i] || `${i + 1}`;
        ctx.fillText(label, pt.x + 8, pt.y - 8);
      });
    }

    function updateCoordsDisplay() {
      if (imageFiles.length === 0) {
        coordsDisplay.textContent = "이미지를 선택한 뒤, 좌표를 클릭해 주세요.";
        return;
      }

      coordsDisplay.textContent = points.length === 0
        ? "선택된 좌표 없음"
        : points
          .map((pt, i) => `${pointLabels[i] || i + 1}: (${pt.x.toFixed(1)}, ${pt.y.toFixed(1)})`)
          .join("\n");
    }

    // 파일 선택 시
    fileInput.addEventListener("change", (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length === 0) {
        imageFiles = [];
        currentImageIndex = 0;
        points = [];
        results.length = 0;
        loadImage(currentImageIndex);
        return;
      }

      imageFiles = files;
      currentImageIndex = 0;
      points = [];
      results.length = 0;
      loadImage(currentImageIndex);
    });

    // 캔버스 클릭 → 좌표 추가
    canvas.addEventListener("click", function (e) {
      if (imageFiles.length === 0) return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      points.push({ x, y });

      // 다시 그리기
      loadImage(currentImageIndex);
    });

    // 이전 이미지
    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentImageIndex > 0) {
        // 이동 전 현재 이미지 좌표 저장
        if (points.length >= 6) {
          const fileName = imageFiles[currentImageIndex].name;
          const yValues = points.map(pt => pt.y.toFixed(1));
          results.push([fileName, ...yValues]);
        }
        currentImageIndex--;
        points = [];
        loadImage(currentImageIndex);
      }
    });

    // 다음 이미지
    document.getElementById("nextBtn").addEventListener("click", () => {
      if (currentImageIndex < imageFiles.length - 1) {
        // 이동 전 현재 이미지 좌표 저장
        if (points.length >= 6) {
          const fileName = imageFiles[currentImageIndex].name;
          const yValues = points.map(pt => pt.y.toFixed(1));
          results.push([fileName, ...yValues]);
        }
        currentImageIndex++;
        points = [];
        loadImage(currentImageIndex);
      }
    });

    // 현재 이미지 좌표 초기화
    document.getElementById("resetBtn").addEventListener("click", () => {
      points = [];
      loadImage(currentImageIndex);
    });

    // 전체 데이터 초기화
    document.getElementById("clearAllBtn").addEventListener("click", () => {
      points = [];
      results.length = 0;
      loadImage(currentImageIndex);
      alert("전체 데이터가 초기화되었습니다.");
    });

    // 현재 좌표 텍스트 복사
    document.getElementById("copyBtn").addEventListener("click", () => {
      const text = points
        .map((pt, i) => `${pointLabels[i] || i + 1}: (${pt.x.toFixed(1)}, ${pt.y.toFixed(1)})`)
        .join("\n");
      if (!text) {
        alert("복사할 좌표가 없습니다.");
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        alert("좌표가 복사되었습니다!");
      }).catch(() => {
        alert("복사 실패. 드래그해서 직접 복사해 주세요.");
      });
    });

    // CSV 다운로드
    document.getElementById("downloadBtn").addEventListener("click", () => {
      // 현재 이미지 좌표도 포함
      if (imageFiles.length > 0 && points.length >= 6) {
        const fileName = imageFiles[currentImageIndex].name;
        const yValues = points.map(pt => pt.y.toFixed(1));
        results.push([fileName, ...yValues]);
      }

      if (results.length === 0) {
        alert("다운로드할 데이터가 없습니다.");
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,파일명,정수리Y,턱Y,가랑이Y,발끝Y,배꼽Y,손끝Y\n";
      results.forEach(row => {
        csvContent += row.join(",") + "\n";
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "coordinates.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // 초기 상태
    updateCoordsDisplay();
  </script>
</body>
</html>
